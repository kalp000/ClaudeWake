org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official

# Kotlin compiler daemon configuration & fallback strategy
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.useFallbackStrategy=true
# Kotlin 1.9's daemon intermittently fails to flush its incremental caches under Gradle 9.
kotlin.compiler.execution.strategy=in-process
